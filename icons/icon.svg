      <stop offset="0" stop-color="#1b2145"/>
      <stop offset="1" stop-color="#080b18"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="1" stop-color="#4ad0d8"/>
