  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <g fill="#ffffff">
    <circle cx="123" cy="133" r="7" opacity=".85"/>
    <circle cx="389" cy="102" r="5" opacity=".7"/>
    <circle cx="154" cy="379" r="5" opacity=".6"/>
