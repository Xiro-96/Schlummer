<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Schlummer - Schlafplan &amp; Einschlafgeräusche</title>
    <meta
      name="description"
      content="Kostenloser Schlafplaner für Babys und Kleinkinder: Wachfenster, Nickerchen-Vorschläge, Schlafprotokoll und synthetische Einschlafgeräusche. Alles offline im Browser."
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Schlummer" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar" id="topbar"></header>
      <main id="view" tabindex="-1"></main>
    </div>

    <div id="nowplaying"></div>

    <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation"></nav>

    <dialog id="dialog"></dialog>

    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8b7dff" />
          <stop offset="100%" stop-color="#4ad0d8" />
        </linearGradient>
      </defs>
    </svg>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
